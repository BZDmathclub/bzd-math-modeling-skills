interface:
  display_name: "BZD 论文格式自查"
  short_description: "逐项检查摘要、标题密度、图表重复、模型可读性与全文排版"
  default_prompt: "使用 $bzd-paper-format-checker 逐条检查这篇数学建模论文，并直接输出规范的 Markdown 报告。核查摘要、标题密度、图表重复、模型正文符号定义、优化模型集中陈述、参考文献与匿名性；每个结论必须有页码或可观察证据。按原子项计算唯一的15分制规范分。用户要求自填表时，提供 assets/数学建模论文自查表.xlsx，不重新生成其他版本。若为高教社杯国赛，未发现目录即满足，严禁建议添加目录。"

interface:
  display_name: "BZD题意逐句翻译"
  short_description: "逐句拆解赛题，生成Mermaid跨问流程图与Markdown报告；华为杯题目额外给出小学应用题式还原"
  default_prompt: "使用 $bzd-problem-translator 从实际题目标题开始逐句拆解赛题，跳过前置竞赛与格式提示，强制生成覆盖所有问题的Mermaid跨问题流程图，并输出一个Markdown文件；仅当用户另行要求时，再用 scripts/render_html.py 把该报告渲染成单文件HTML，HTML只是同一份报告的视图，不得替代Markdown。若为华为杯（中国研究生数学建模竞赛）题目，先在报告最前增加“小学应用题式题意还原”：一句话版、小问一一对应的小学应用题、术语生活化映射表（必须说明每个类比丢掉了什么）、背景知识补课卡，并原文保留不可用于建模的免责提示；该层只做附加，不得替代逐句翻译表。华为杯不按题号预设题型，题面措辞不一致时并列标注而非擅自统一。"

interface:
  display_name: "BZD-review-paper"
  short_description: "区分国赛与小型竞赛，生成专属细则并评审得分位次"
  default_prompt: "使用 $bzd-review-paper。先确认是否为高教社杯国赛；如已有同版本的 $bzd-paper-format-checker 报告，自动接入其格式分与证据，将-10到10分线性映射为0到1.00的格式质量系数。根据赛题制定百分制细则，把每问拆成模型建立、模型求解、结果与回答；每个板块先按90%封顶，再针对评分细则逐条扣1、2或3分，扣至0分为止；与题目或冻结答案根本不一致的板块归零。最后输出HTML报告和对应竞赛规模的位次估计。"
